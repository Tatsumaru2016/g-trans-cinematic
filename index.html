<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta charset="UTF-8" />
    <meta name="description" content="G.trans cinematic experience — seamless global communication" />
    <title>G.trans | Cinematic Experience</title>
    <link rel="icon" type="image/png" href="/g-trans-cinematic/gtran-logo.png" />
    <script type="module" crossorigin src="/g-trans-cinematic/assets/index-1oy7bm4_.js"></script>
    <link rel="stylesheet" crossorigin href="/g-trans-cinematic/assets/index-CYeQkfH6.css">
  </head>
  <body>
    <div id="boot-shell" class="boot-shell" aria-live="polite" aria-busy="true">
      <div class="boot-shell__glow" aria-hidden="true"></div>
      <div class="boot-shell__content">
        <div class="boot-shell__logo" aria-hidden="true">G</div>
        <p class="boot-shell__title">G.trans</p>
        <p class="boot-shell__status">Loading cinematic experience…</p>
        <div class="boot-shell__track" aria-hidden="true">
          <div class="boot-shell__bar"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
  
<script>
(function () {
  var reloadKey = 'gtrans-boot-reload';
  function showBootFailure() {
    var root = document.getElementById('root');
    if (!root || root.childElementCount > 0) return;
    root.innerHTML =
      '<div style="display:flex;min-height:100vh;align-items:center;justify-content:center;background:#050505;color:#fff;font-family:sans-serif;text-align:center;padding:24px">' +
      '<div><p style="margin:0 0 12px;font-size:14px">ページの読み込みに失敗しました。</p>' +
      '<p style="margin:0 0 16px;font-size:12px;color:#94a3b8">デプロイ直後はキャッシュの影響で一時的に表示されないことがあります。</p>' +
      '<button style="padding:8px 16px;border:1px solid #22d3ee;background:transparent;color:#22d3ee;border-radius:8px;cursor:pointer;font-size:12px" ' +
      'onclick="sessionStorage.removeItem(\'' + reloadKey + '\');location.reload()">再読み込み</button></div></div>';
  }
  window.addEventListener('load', function () {
    setTimeout(function () {
      var root = document.getElementById('root');
      if (!root || root.childElementCount > 0) return;
      if (!sessionStorage.getItem(reloadKey)) {
        sessionStorage.setItem(reloadKey, '1');
        location.reload();
        return;
      }
      showBootFailure();
    }, 5000);
  });
  window.addEventListener('pageshow', function (event) {
    if (event.persisted) location.reload();
  });
})();
</script>
  </body>
</html>
